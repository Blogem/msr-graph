[project]
name = "msr-extraction"
version = "0.1.0"
description = "MSR knowledge-graph extraction pipeline (scaffold; real pipeline lands in later chunks)"
requires-python = ">=3.12"
dependencies = [
    "pysbd==0.3.4",
    "httpx==0.28.1",
    "spacy==3.8.7",
    # NOTE: `en_core_web_sm` IS required (refine-mine-salience design D1/D5):
    # the mine novelty pass loads it (`doc.noun_chunks` + NER) to shape
    # candidate enumeration and filter proper nouns, replacing the n-gram
    # explosion a POC showed to be unranked garbage. Pinned as a direct
    # wheel URL (not a PyPI name — spaCy models aren't published there) so
    # the model is fetched at build time, not downloaded at runtime via
    # `spacy download`; inference is CPU-only and deterministic (no GPU,
    # no sampling). Version must track `en_core_web_sm-3.8.x` to match
    # spacy==3.8.7 above. `seeding.py`'s `spacy.blank("en")` + EntityRuler
    # pipeline for NER *linking* is unaffected and still model-free.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Pinned explicitly: spacy's `cli` submodule (imported unconditionally by
    # `import spacy`) does `from click import NoSuchOption` directly, but its
    # `typer<1.0.0,>=0.3.0` dependency resolves to typer>=0.16 by default,
    # which no longer requires click transitively -> ModuleNotFoundError
    # without this direct pin.
    "click==8.1.8",
    "rapidfuzz==3.10.1",
    "openai==1.57.0",
    # Chunk 11 (ingest-iaea-safety D1/1.3) — text-layer PDF extraction for the
    # safety-source genre (pypdf), plus cryptography for the encrypted IAEA
    # SRS-123 PDF that pypdf needs it to open.
    "pypdf>=4,<6",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "rdflib>=7,<8"]

[project.scripts]
msr-extraction = "msr_extraction:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msr_extraction"]

[tool.hatch.metadata]
# Required by hatchling because `en_core_web_sm` above is a direct wheel-URL
# dependency (spaCy models are not published on PyPI under that name), not
# an index/version-spec dependency.
allow-direct-references = true
