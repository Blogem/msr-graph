[project]
name = "msr-extraction"
version = "0.1.0"
description = "MSR knowledge-graph extraction pipeline (scaffold; real pipeline lands in later chunks)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
msr-extraction = "msr_extraction:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msr_extraction"]
